syntax = "proto3";

package keleustes;

option go_package = "github.com/katastroma/keleustes";

// RendererService produces Kubernetes manifests from source content.
service RendererService {
  rpc RenderStream(stream RenderStreamRequest) returns (stream RenderStreamResponse);
  rpc Render(stream RenderRequest) returns (RenderResponse);
}

// RendererType identifies which rendering backend to use.
enum RendererType {
  RENDERER_TYPE_UNSPECIFIED = 0;
  RENDERER_TYPE_PLAIN = 1;
  RENDERER_TYPE_HELM = 2;
  RENDERER_TYPE_KUSTOMIZE = 3;
}

// Streamed source content to be rendered.
message RenderStreamRequest {
  bytes data = 1;
}

// Rendered Kubernetes manifests.
message RenderStreamResponse {
  bytes data = 1;
}

// Streamed source content to be rendered.
message RenderRequest {
  bytes data = 1;
}

// Rendered Kubernetes manifests.
message RenderResponse {}
